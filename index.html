<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Paisley's Fitness Tracker</title>
<style>
  /* ---------- THEME: change these to restyle the whole app ---------- */
  :root {
    --bg:        #08090d;   /* page background - near black */
    --panel:     #0f111a;   /* cards / panels - dark charcoal blue */
    --panel-2:   #161825;   /* slightly raised panel (nested cards) */
    --border:    #202333;
    --text:      #e8ecf5;
    --text-dim:  #848ba3;
    --blue:      #1f3d78;   /* primary dark blue - buttons */
    --blue-dim:  #142042;
    --accent:    #3d6fc7;   /* darker blue accent - active states, timer */
    --accent-2:  #5a86d4;
    --danger:    #ff5e6c;
    --good:      #4fd18b;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    font-size: 18px;
  }
  body {
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  h1,h2,h3,h4 { margin: 0 0 10px 0; font-weight: 700; }
  h1 { font-size: 23px; }
  h2 { font-size: 19px; color: var(--accent); }
  h3 { font-size: 16px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  p { margin: 0 0 8px 0; }
  a { color: var(--accent); }

  #app { max-width: 640px; margin: 0 auto; padding: 18px; }

  .topbar {
    max-width: 640px; margin: 0 auto; padding: 16px 18px 12px 18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar h1 { display:flex; align-items:center; gap:8px; }
  .topbar .dot { width:11px; height:11px; border-radius:50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-2 {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 10px;
  }

  .btn {
    display: inline-flex; align-items:center; justify-content:center; gap:6px;
    background: var(--blue); color: #fff; border: none; border-radius: 11px;
    padding: 14px 20px; font-size: 17px; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: .8; }
  .btn.accent { background: var(--accent); color: #05121f; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.small { padding: 9px 13px; font-size: 15px; border-radius: 9px; }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .4; }

  .row { display:flex; gap:8px; align-items:center; }
  .row.wrap { flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grow { flex: 1; }
  .muted { color: var(--text-dim); font-size: 15px; }
  .pill {
    display:inline-block; padding: 4px 11px; border-radius: 999px;
    background: var(--blue-dim); color: var(--accent-2); font-size: 13px; font-weight: 600;
  }

  input, select, textarea {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 12px 13px; font-size: 17px; width: 100%;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  label { font-size: 14px; color: var(--text-dim); display:block; margin-bottom: 5px; }
  .field { margin-bottom: 12px; }
  .num { width: 86px; text-align: center; }

  .tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(18,20,28,0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }
  .tab {
    flex: 1; text-align: center; padding: 14px 4px 11px 4px; cursor: pointer;
    color: var(--text-dim); font-size: 13px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .tab .icon { font-size: 27px; display:block; margin-bottom: 3px; }
  .tab.active { color: var(--accent); }

  .timer {
    font-size: 42px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }

  .list-item {
    display:flex; justify-content:space-between; align-items:center;
    padding: 15px 5px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .list-item:last-child { border-bottom: none; }

  .set-row { display:flex; gap:7px; align-items:center; margin-bottom:8px; }
  .set-row .idx { width: 26px; color: var(--text-dim); font-size:15px; text-align:center; }
  .drop-row { margin-left: 32px; margin-bottom:8px; }
  .drop-tag { color: var(--danger); font-size: 13px; font-weight:700; margin-right:6px; }

  .superset-wrap { border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 14px; }
  .superset-label { color: var(--accent); font-size: 13px; font-weight:700; text-transform:uppercase; margin-bottom:7px; }

  .empty {
    text-align:center; color: var(--text-dim); padding: 34px 12px;
  }

  .badge-group { display:flex; flex-wrap:wrap; gap:7px; margin: 7px 0 12px 0; }
  .chip {
    padding: 7px 14px; border-radius: 999px; border:1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); font-size: 15px; cursor:pointer;
  }
  .chip.active { background: var(--blue-dim); color: var(--accent-2); border-color: var(--blue); }

  .search-box { margin-bottom: 12px; }

  .modal-overlay {
    position: fixed; inset:0; background: rgba(0,0,0,.6); z-index: 100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal {
    background: var(--panel); border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 18px; width:100%; max-width:640px;
    max-height: 86vh; overflow-y:auto;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .modal-handle { width:44px; height:5px; background: var(--border); border-radius:3px; margin: 0 auto 16px auto; }

  table { width:100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align:left; padding: 9px 5px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight:600; font-size: 13px; text-transform:uppercase; }

  .vol-bar-track { background: var(--panel-2); border-radius: 4px; height: 7px; overflow:hidden; margin-top:5px; }
  .vol-bar-fill { background: var(--accent); height:100%; }

  .body-figure { width:100%; height:auto; display:block; }
  .body-figure path, .body-figure ellipse {
    stroke: rgba(0,0,0,.4); stroke-width: 0.15; stroke-linejoin: round; transition: fill .3s;
  }
  .body-neutral { fill:#2b2f45; }
  .body-figure-row { display:flex; gap:14px; justify-content:center; margin: 8px 0 14px 0; }
  .body-figure-row .col { width: 40%; text-align:center; }
  .body-figure-row .col .muted { display:block; margin-top:4px; }
  .mini-figures { display:flex; gap:10px; margin: 8px 0; }
  .mini-figures .col { width: 46px; }

  .muscle-row { display:flex; justify-content:space-between; align-items:center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .muscle-row:last-child { border-bottom: none; }
  .legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .photo-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:10px; }
  .photo-thumb { width:100%; aspect-ratio: 3/4; object-fit:cover; border-radius:10px; border:1px solid var(--border); cursor:pointer; background:var(--panel-2); display:block; }
  .photo-thumb-date { font-size:12px; color:var(--text-dim); text-align:center; margin-top:4px; }

  .measure-row { display:flex; gap:8px; margin-bottom:8px; align-items:flex-end; }
  .measure-row .field { flex:1; margin-bottom:0; }

  .suggestion-text { white-space:pre-wrap; font-size:16px; line-height:1.55; }
  .spinner-text { color: var(--accent); font-size: 15px; }

  ::placeholder { color: #4a5068; }
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="dot"></span> Paisley's Fitness Tracker</h1>
  <div class="muted" id="dateLabel"></div>

<div id="app"></div>

<div class="tabs">
  <div class="tab" data-tab="train"><span class="icon">🏋️</span>Train</div>

  <div class="tab" data-tab="menu"><span class="icon">☰</span>Menu</div>
</div>

  if (!ex) console.warn("Exercise not found in library:", name);

  if (/^(shoulder|deltoid-rear)/.test(id)) return "Shoulders";
  if (/^traps/.test(id)) return "Traps";
  if (/^biceps/.test(id)) return "Biceps";
  if (/^triceps/.test(id)) return "Triceps";
  if (/^forearm/.test(id)) return "Forearms";
  if (/^chest/.test(id)) return "Chest";
  if (/^(lats|lower-back)/.test(id)) return "Back";
  if (/^gluteus/.test(id)) return "Glutes";
  if (/^(abs|serratus|obliques)/.test(id)) return "Core";
  if (/^(quads|adductors|hip-flexor)/.test(id)) return "Quads";
  if (/^hamstrings/.test(id)) return "Hamstrings";
  if (/^(tibialis|calves)/.test(id)) return "Calves";
  return null;
}
const MUSCLE_ATLAS_FRONT = MUSCLE_ATLAS_FRONT_RAW.map(m => ({ ...m, group: atlasGroupFor(m.id) }));
const MUSCLE_ATLAS_BACK = MUSCLE_ATLAS_BACK_RAW.map(m => ({ ...m, group: atlasGroupFor(m.id) }));

function muscleColor(t) {
  t = Math.max(0, Math.min(1, t || 0));
  const light = 16 + t * 46;
  const sat = 16 + t * 68;
  return `hsl(219, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
}

function renderBodyFigure(view, colorForGroup) {
  const atlas = view === "front" ? MUSCLE_ATLAS_FRONT : MUSCLE_ATLAS_BACK;
  const vb = view === "front" ? "0 0 35 93" : "37 0 35 93";
  const shapes = atlas.map(m => {
    if (!m.group) return `<path class="body-neutral" d="${m.d}"/>`;
    return `<path fill="${colorForGroup(m.group)}" d="${m.d}"/>`;
  }).join("");
  return `<svg viewBox="${vb}" class="body-figure" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
}

function computeMuscleScores(days) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  const vol = {};
  MUSCLE_GROUPS.forEach(g => vol[g] = 0);
  state.workouts.forEach(w => {
    if (new Date(w.date).getTime() < cutoff) return;
    w.entries.forEach(e => {
      if (e.kind !== "strength") return;
      let evol = 0;
      e.sets.forEach(s => {
        evol += (Number(s.weight) || 0) * (Number(s.reps) || 0);
        (s.drops || []).forEach(d => evol += (Number(d.weight) || 0) * (Number(d.reps) || 0));
      });
      (e.groups || []).forEach(g => { vol[g] = (vol[g] || 0) + evol; });
    });
  });
  const max = Math.max(1, ...Object.values(vol));
  const scores = {};
  Object.keys(vol).forEach(g => scores[g] = vol[g] / max);
  return { scores, vol };
}

/* ---------------- Progress photo storage (IndexedDB) ----------------
   Photos are compressed client-side, then stored as blobs in IndexedDB
   (localStorage is too small/slow for images). state.photosCache holds
   an in-memory copy with object URLs for rendering. */
const PHOTO_DB_NAME = "il_photos_db", PHOTO_DB_VERSION = 1, PHOTO_STORE = "photos";
function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PHOTO_DB_NAME, PHOTO_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbAddPhoto(photo) {
  return openPhotoDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readwrite");
    tx.objectStore(PHOTO_STORE).put(photo);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function dbGetAllPhotos() {
  return openPhotoDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readonly");
    const req = tx.objectStore(PHOTO_STORE).getAll();
    req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.date.localeCompare(a.date)));
    req.onerror = () => reject(req.error);
  }));
}
function dbDeletePhoto(id) {
  return openPhotoDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readwrite");
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1280; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("compress failed")), "image/jpeg", quality);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let photoObjectUrls = [];
function loadPhotos() {
  return dbGetAllPhotos().then(photos => {
    photoObjectUrls.forEach(u => URL.revokeObjectURL(u));
    photoObjectUrls = [];
    state.photosCache = photos.map(p => {
      const url = URL.createObjectURL(p.blob);
      photoObjectUrls.push(url);
      return { id: p.id, date: p.date, url };
    });
  });
}

/* ---------------- Backup / restore (no account needed) ----------------
   Everything lives in localStorage + IndexedDB on this device only.
   Export bundles it all (minus the API key) into one JSON file the user
   can AirDrop/save, then import merges it back in on any device. */
async function exportBackup() {
  const photos = await dbGetAllPhotos();
  const photosData = await Promise.all(photos.map(p => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ id: p.id, date: p.date, dataUrl: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(p.blob);
  })));

  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    customExercises: state.customExercises,
    routines: state.routines,
    workouts: state.workouts,
    bodyMetrics: state.bodyMetrics,
    suggestions: state.suggestions,
    photos: photosData,
  };
  const json = JSON.stringify(backup, null, 2);
  const filename = `fitness-tracker-backup-${todayISODate()}.json`;
  const file = new File([json], filename, { type: "application/json" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Fitness Tracker Backup" });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function importBackup(file) {
  let backup;
  try {
    backup = JSON.parse(await file.text());
  } catch (e) {
    alert("That doesn't look like a valid backup file.");
    return;
  }
  if (!backup || typeof backup !== "object") {
    alert("That doesn't look like a valid backup file.");
    return;
  }
  if (!confirm("Restore this backup? It will be merged into what's already on this device — nothing existing gets deleted.")) return;

  const mergeById = (existing, incoming) => {
    const ids = new Set(existing.map(x => x.id));
    (incoming || []).forEach(x => { if (!ids.has(x.id)) existing.push(x); });
  };
  mergeById(state.customExercises, backup.customExercises);
  mergeById(state.routines, backup.routines);
  mergeById(state.workouts, backup.workouts);
  mergeById(state.bodyMetrics, backup.bodyMetrics);
  state.workouts.sort((a, b) => new Date(b.date) - new Date(a.date));
  persist(["customExercises", "routines", "workouts", "bodyMetrics"]);

  if (backup.photos && backup.photos.length) {
    const existingIds = new Set(state.photosCache.map(p => p.id));
    for (const p of backup.photos) {
      if (existingIds.has(p.id)) continue;
      const blob = await (await fetch(p.dataUrl)).blob();
      await dbAddPhoto({ id: p.id, date: p.date, blob });
    }
    await loadPhotos();
  }
  alert("Backup restored.");
  render();
}

function groupEntriesBySuperset(entries) {
  const groups = [];
  const seen = new Set();
  entries.forEach((e, i) => {
    if (seen.has(e.id)) return;
    if (e.supersetGroup) {
      const partners = entries.filter(x => x.supersetGroup === e.supersetGroup);
      partners.forEach(p => seen.add(p.id));
      groups.push({ superset: true, groupId: e.supersetGroup, entries: partners });
    } else {
      seen.add(e.id);
      groups.push({ superset: false, entries: [e] });
    }
  });
  return groups;
}

  const inner = g.entries.map(e => renderExerciseEntry(e)).join("");
  if (g.superset) {

  return inner;
}

function renderWorkoutHistory() {

function renderReadonlyEntryGroup(g) {
  const inner = g.entries.map(e => {
    if (e.kind === "cardio") {
      return `<div class="card-2"><strong>🏃 ${escapeHtml(e.name)}</strong><div class="muted">${e.durationMin} min${e.distance? " · "+e.distance:""}</div></div>`;
    }
    const sets = e.sets.map((s,i) => `${s.weight||0}×${s.reps||0}${(s.drops||[]).length ? " → drop " + s.drops.map(d=>`${d.weight||0}×${d.reps||0}`).join(" → ") : ""}`).join(", ");
    return `<div class="card-2"><strong>${escapeHtml(e.exerciseName)}</strong><div class="muted">${sets}</div></div>`;
  }).join("");
  return g.superset ? `<div class="superset-wrap"><div class="superset-label">Superset</div>${inner}</div>` : inner;
}

function totalVolume(w) {
  let total = 0;
  w.entries.forEach(e => {
    if (e.kind !== "strength") return;
    e.sets.forEach(s => {
      total += (Number(s.weight)||0) * (Number(s.reps)||0);
      (s.drops||[]).forEach(d => total += (Number(d.weight)||0) * (Number(d.reps)||0));
    });
  });
  return total;
}

function renderExerciseHistory() {
  const exOptions = allExercises()
    .filter(e => state.workouts.some(w => w.entries.some(en => en.exerciseId === e.id)))
    .sort((a,b) => a.name.localeCompare(b.name));

  if (!exOptions.length) return `<div class="empty">Log some workouts first — then you can track progress per exercise here.</div>`;

  if (!selectedHistoryExercise) selectedHistoryExercise = exOptions[0].id;

  const rows = [];
  state.workouts.slice().reverse().forEach(w => {
    w.entries.filter(e => e.exerciseId === selectedHistoryExercise).forEach(e => {
      let best = 0, vol = 0;
      e.sets.forEach(s => {
        const w1 = Number(s.weight)||0, r1 = Number(s.reps)||0;
        if (w1 > best) best = w1;
        vol += w1*r1;
        (s.drops||[]).forEach(d => vol += (Number(d.weight)||0)*(Number(d.reps)||0));
      });
      rows.push({ date: w.date, best, vol, sets: e.sets.length });
    });
  });
  const maxVol = Math.max(1, ...rows.map(r => r.vol));

  return `
    <div class="card">
      <label>Exercise</label>
      <select id="historyExerciseSelect">
        ${exOptions.map(e => `<option value="${e.id}" ${e.id===selectedHistoryExercise?"selected":""}>${escapeHtml(e.name)}</option>`).join("")}
      </select>
    </div>
    <div class="card">
      ${rows.length ? rows.map(r => `
        <div class="card-2">
          <div class="row between"><strong>${fmtDate(r.date)}</strong><span class="muted">${r.sets} sets</span></div>
          <div class="muted">Top weight: ${r.best} lb &nbsp;·&nbsp; Volume: ${r.vol.toLocaleString()} lb</div>
          <div class="vol-bar-track"><div class="vol-bar-fill" style="width:${(r.vol/maxVol*100).toFixed(0)}%"></div></div>
        </div>
      `).join("") : `<div class="empty">No entries yet for this exercise.</div>`}
    </div>
  `;
}

function buildTrainingSummary() {
  const { vol } = computeMuscleScores(30);
  const lines = [];

  lines.push("MUSCLE GROUP TRAINING VOLUME (last 30 days, arbitrary units = sum of weight x reps):");
  MUSCLE_GROUPS.forEach(g => lines.push(`- ${g}: ${Math.round(vol[g] || 0)}`));

  lines.push("");
  lines.push(`WORKOUTS LOGGED (last 30 days): ${state.workouts.filter(w => Date.now() - new Date(w.date).getTime() < 30*24*60*60*1000).length}`);

  lines.push("");
  lines.push("CURRENT ROUTINES:");
  state.routines.forEach(r => {
    const names = r.exercises.map(routineItemName).join(", ");
    lines.push(`- ${r.name}: ${names || "(empty)"}`);
  });

  lines.push("");
  lines.push("RECENT PERFORMANCE PER EXERCISE (most recent sessions, top set = highest weight x reps that session):");
  const exIds = [...new Set(state.workouts.flatMap(w => w.entries.filter(e => e.kind === "strength").map(e => e.exerciseId)))];
  exIds.forEach(exId => {
    const ex = exerciseById(exId);
    if (!ex) return;
    const sessions = [];
    state.workouts.forEach(w => {
      w.entries.filter(e => e.exerciseId === exId).forEach(e => {
        let best = { weight: 0, reps: 0 };
        e.sets.forEach(s => { if ((Number(s.weight)||0) >= best.weight) best = { weight: Number(s.weight)||0, reps: Number(s.reps)||0 }; });
        sessions.push({ date: w.date, best });
      });
    });
    sessions.sort((a,b) => new Date(b.date) - new Date(a.date));
    const recent = sessions.slice(0, 4).reverse();
    if (recent.length) {
      lines.push(`- ${ex.name}: ` + recent.map(s => `${fmtDate(s.date)}: ${s.best.weight}x${s.best.reps}`).join(" -> "));
    }
  });

  const latestMetric = state.bodyMetrics.slice().sort((a,b) => b.date.localeCompare(a.date))[0];
  if (latestMetric) {
    lines.push("");
    lines.push(`MOST RECENT BODY METRICS (${fmtDate(latestMetric.date)}): height ${latestMetric.height || "?"}, weight ${latestMetric.weight || "?"}`);
  }

  return lines.join("\n");
}

async function callClaudeAPI(systemPrompt, userText) {
  const key = state.settings.apiKey;
  if (!key) { const e = new Error("No API key set."); e.code = "NO_KEY"; throw e; }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1200,
      system: systemPrompt,
      messages: [{ role: "user", content: userText }]
    })
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`API error ${res.status}: ${errText.slice(0, 300)}`);
  }
  const data = await res.json();
  return (data.content || []).map(b => b.text || "").join("");
}

        </button>
      </div>
      ${general ? `<p class="muted">Generated ${fmtDate(general.generatedAt)}</p><div class="suggestion-text">${escapeHtml(general.text)}</div>` : `<p class="muted">Get a read on your overall training: muscle balance, stalled lifts, what to prioritize next.</p>`}
    </div>
  `;

  const routinesCards = state.routines.map(r => {
    const sug = state.suggestions.byRoutine[r.id];
    const loading = suggestionsLoading === r.id;
    return `
      <div class="card">
        <div class="row between">
          <h2 style="margin:0;">${escapeHtml(r.name)}</h2>
          <button class="btn ghost small" data-action="get-suggestions-routine" data-id="${r.id}" ${loading ? "disabled" : ""}>
            ${loading ? "Thinking..." : (sug ? "Refresh" : "Suggest")}
          </button>
        </div>
        <div class="badge-group">${r.exercises.map(e => `<span class="pill">${escapeHtml(routineItemName(e))}</span>`).join("")}</div>
        ${sug ? `<div class="suggestion-text">${escapeHtml(sug.text)}</div>` : ""}
      </div>
    `;
  }).join("");

  return `
    ${genCard}
    <h3 style="margin:16px 0 8px 4px;">Your Routines</h3>
    ${state.routines.length ? routinesCards : `<div class="empty">No routines yet — build one in the Routines tab.</div>`}
  `;
}

async function generateSuggestions(target) {
  suggestionsLoading = target === "general" ? "general" : target.id;
  render();
  try {
    const summary = buildTrainingSummary();
    const userText = target === "general"
      ? `Here is my current training data:\n\n${summary}\n\nGive me an overall read on my training: which muscle groups need more attention, which lifts look stalled and what to do about it, and what I should prioritize over the next couple weeks.`
      : `Here is my current training data:\n\n${summary}\n\nFocus specifically on this routine: "${target.name}" (exercises: ${target.exercises.map(routineItemName).join(", ")}). Suggest specific edits to this routine — progressive overload on specific exercises, anything to swap or add, given how it's been going.`;
    const text = await callClaudeAPI(SUGGESTIONS_SYSTEM_PROMPT, userText);
    if (target === "general") {
      state.suggestions.general = { text, generatedAt: new Date().toISOString() };
    } else {
      state.suggestions.byRoutine[target.id] = { text, generatedAt: new Date().toISOString() };
    }
    persist(["suggestions"]);
  } catch (err) {
    alert(err.code === "NO_KEY" ? "Add your Claude API key in Settings first." : "Couldn't get suggestions: " + err.message);
  } finally {
    suggestionsLoading = null;
    render();
  }
}

      <p class="muted">Coming up next: send a photo or description of what you ate and get an instant calorie estimate logged to your day.</p>

/* ================= SETTINGS TAB ================= */
function renderSettings() {
  return `
    <div class="card">
      <h2>Claude API Key</h2>
      <p class="muted">Powers two features: the Calorie Chat (estimating calories from food photos/descriptions) and the Suggestions tab (analyzing your training data). Stored only on this device.</p>
      <div class="field"><input id="apiKeyInput" type="password" placeholder="sk-ant-..." value="${escapeAttr(state.settings.apiKey)}"></div>
      <button class="btn accent block" data-action="save-api-key">Save Key</button>
    </div>
    <div class="card">
      <h3>About</h3>
      <p class="muted">Paisley's Fitness Tracker stores everything locally on this device — your workouts, routines, body metrics, and photos never leave your phone, except when you use Calorie Chat or Suggestions, which send the relevant data (a food photo/description, or a summary of your training) to Claude to get a response.</p>
    </div>
    <div class="card">
      <h3>Backup &amp; Restore</h3>
      <p class="muted">Your data only lives on this phone. Export a backup file every so often (or right before switching phones), and restore it on a new device to bring everything back — workouts, routines, body metrics, and photos. Your API key is left out of backups for safety; re-add it above after restoring.</p>
      <button class="btn accent block" style="margin-bottom:10px;" data-action="export-backup">Export Backup</button>
      <input type="file" accept="application/json" id="restoreInput" style="display:none;">
      <button class="btn ghost block" data-action="restore-backup">Restore from Backup</button>
    </div>
    <div class="card">
      <h3>Danger Zone</h3>
      <button class="btn danger block" data-action="clear-all-data">Erase All Data</button>
    </div>
  `;
}

/* ================= MODAL ================= */
function showModal(html) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal"><div class="modal-handle"></div>${html}</div>`;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  wireDynamicHandlers(overlay);
}
function closeModal() {
  const o = document.getElementById("modalOverlay");
  if (o) o.remove();
}

/* ================= EVENT WIRING ================= */
function escapeHtml(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function escapeAttr(s) { return escapeHtml(s); }

function wireTabHandlers() {
  wireDynamicHandlers(document.getElementById("app"));
  if (state.activeWorkout) startTimerTick();
}

function wireDynamicHandlers(root) {
  root.querySelectorAll("[data-action]").forEach(el => {
    const action = el.dataset.action;
    if (el.dataset.wired) return;
    el.dataset.wired = "1";

    if (action === "start-empty") el.addEventListener("click", () => startWorkout(null));
    if (action === "start-routine") el.addEventListener("click", () => startWorkout(state.routines.find(r => r.id === el.dataset.id)));
    if (action === "finish-workout") el.addEventListener("click", () => { if (confirm("Finish and save this workout?")) finishWorkout(); });
    if (action === "cancel-workout") el.addEventListener("click", () => {
      if (confirm("Discard this workout? Nothing will be saved.")) {
        state.activeWorkout = null;
        persist(["activeWorkout"]);
        render();
      }
    });
    if (action === "open-add-exercise") el.addEventListener("click", () => openAddExerciseModal(null));
    if (action === "open-add-cardio") el.addEventListener("click", () => openAddCardioModal());
    if (action === "open-custom-exercise") el.addEventListener("click", () => openCustomExerciseModal());
    if (action === "save-custom-exercise") el.addEventListener("click", () => saveCustomExercise());
    if (action === "pick-exercise") el.addEventListener("click", () => addExerciseToWorkout(el.dataset.id, pendingSupersetSourceId));
    if (action === "save-cardio") el.addEventListener("click", () => saveCardioEntry());
    if (action === "make-superset") el.addEventListener("click", () => openAddExerciseModal(el.dataset.id));
    if (action === "remove-entry") el.addEventListener("click", () => {
      state.activeWorkout.entries = state.activeWorkout.entries.filter(e => e.id !== el.dataset.id);
      saveActiveWorkout(); render();
    });
    if (action === "add-set") el.addEventListener("click", () => {
      const entry = state.activeWorkout.entries.find(e => e.id === el.dataset.id);
      entry.sets.push({ weight:"", reps:"" });
      saveActiveWorkout(); render();
    });
    if (action === "remove-set") el.addEventListener("click", () => {
      const entry = state.activeWorkout.entries.find(e => e.id === el.dataset.id);
      entry.sets.splice(Number(el.dataset.set), 1);
      if (entry.sets.length === 0) entry.sets.push({weight:"",reps:""});
      saveActiveWorkout(); render();
    });
    if (action === "add-drop") el.addEventListener("click", () => {
      const entry = state.activeWorkout.entries.find(e => e.id === el.dataset.id);
      const set = entry.sets[Number(el.dataset.set)];
      set.drops = set.drops || [];
      set.drops.push({ weight:"", reps:"" });
      saveActiveWorkout(); render();
    });
    if (action === "remove-drop") el.addEventListener("click", () => {
      const entry = state.activeWorkout.entries.find(e => e.id === el.dataset.id);
      const set = entry.sets[Number(el.dataset.set)];
      set.drops.splice(Number(el.dataset.drop), 1);
      saveActiveWorkout(); render();
    });
    if (action === "set-field") el.addEventListener("input", () => {
      const entry = state.activeWorkout.entries.find(e => e.id === el.dataset.id);
      entry.sets[Number(el.dataset.set)][el.dataset.field] = el.value;
      saveActiveWorkout();
    });
    if (action === "drop-field") el.addEventListener("input", () => {
      const entry = state.activeWorkout.entries.find(e => e.id === el.dataset.id);
      entry.sets[Number(el.dataset.set)].drops[Number(el.dataset.drop)][el.dataset.field] = el.value;
      saveActiveWorkout();
    });

    // Routines
    if (action === "new-routine") el.addEventListener("click", () => { routineDraft = { id:null, name:"", exercises:[] }; render(); });
    if (action === "edit-routine") el.addEventListener("click", () => {
      const r = state.routines.find(r => r.id === el.dataset.id);
      routineDraft = JSON.parse(JSON.stringify(r));
      render();
    });
    if (action === "delete-routine") el.addEventListener("click", () => {
      if (confirm("Delete this routine?")) {
        state.routines = state.routines.filter(r => r.id !== el.dataset.id);
        persist(["routines"]); render();
      }
    });
    if (action === "draft-add-exercise") el.addEventListener("click", () => openDraftExercisePicker());
    if (action === "draft-add-cardio") el.addEventListener("click", () => openDraftCardioModal());
    if (action === "draft-pick-exercise") el.addEventListener("click", () => {
      routineDraft.exercises.push({ type:"strength", exerciseId: el.dataset.id, targetSets:"", targetReps:"", supersetGroup:null });
      closeModal(); render();
    });
    if (action === "draft-save-cardio") el.addEventListener("click", () => {
      const name = document.getElementById("draftCardioActivity").value;
      routineDraft.exercises.push({ type:"cardio", name, supersetGroup:null });
      closeModal(); render();
    });
    if (action === "draft-toggle-superset") el.addEventListener("click", () => {
      toggleDraftSuperset(Number(el.dataset.idx));
      render();
    });
    if (action === "draft-remove-exercise") el.addEventListener("click", () => {
      const removed = routineDraft.exercises.splice(Number(el.dataset.idx), 1)[0];
      if (removed && removed.supersetGroup) {
        const stillShared = routineDraft.exercises.some(it => it.supersetGroup === removed.supersetGroup);
        if (!stillShared) {
          routineDraft.exercises.forEach(it => { if (it.supersetGroup === removed.supersetGroup) it.supersetGroup = null; });
        }
      }
      render();
    });
    if (action === "cancel-routine") el.addEventListener("click", () => { routineDraft = null; render(); });
    if (action === "save-routine") el.addEventListener("click", () => {
      const name = document.getElementById("routineName").value.trim();
      if (!name) { alert("Please name your routine."); return; }
      routineDraft.name = name;
      if (routineDraft.id) {
        const i = state.routines.findIndex(r => r.id === routineDraft.id);
        state.routines[i] = routineDraft;
      } else {
        routineDraft.id = uid();
        state.routines.push(routineDraft);
      }
      persist(["routines"]);
      routineDraft = null;
      render();
    });

    // Menu sheet
    if (action === "goto-tab") el.addEventListener("click", () => {
      state.tab = el.dataset.tab;
      closeModal();
      render();
    });

    // History
    if (action === "history-mode") el.addEventListener("click", () => { historyMode = el.dataset.mode; render(); });
    if (action === "toggle-workout") el.addEventListener("click", () => {
      expandedWorkoutId = expandedWorkoutId === el.dataset.id ? null : el.dataset.id;
      render();
    });

    // Body composition
    if (action === "bm-add-row") el.addEventListener("click", () => { bodyMetricDraftRows.push({ label:"", value:"" }); render(); });
    if (action === "bm-remove-row") el.addEventListener("click", () => { bodyMetricDraftRows.splice(Number(el.dataset.idx), 1); render(); });
    if (action === "bm-row-field") el.addEventListener("input", () => {
      bodyMetricDraftRows[Number(el.dataset.idx)][el.dataset.field] = el.value;
    });
    if (action === "save-body-metric") el.addEventListener("click", () => {
      const date = document.getElementById("bmDate").value || todayISODate();
      const height = document.getElementById("bmHeight").value.trim();
      const weight = document.getElementById("bmWeight").value.trim();
      const measurements = {};
      bodyMetricDraftRows.forEach(r => { if (r.label.trim()) measurements[r.label.trim()] = r.value.trim(); });
      state.bodyMetrics.push({ id: uid(), date, height, weight, measurements });
      persist(["bodyMetrics"]);
      bodyMetricDraftRows = [];
      render();
    });
    if (action === "delete-body-metric") el.addEventListener("click", () => {
      if (confirm("Delete this entry?")) {
        state.bodyMetrics = state.bodyMetrics.filter(m => m.id !== el.dataset.id);
        persist(["bodyMetrics"]);
        render();
      }
    });
    if (action === "add-body-photo") el.addEventListener("click", () => document.getElementById("bodyPhotoInput").click());
    if (action === "view-photo") el.addEventListener("click", () => openPhotoModal(el.dataset.id));
    if (action === "delete-photo") el.addEventListener("click", () => {
      if (confirm("Delete this photo?")) {
        dbDeletePhoto(el.dataset.id).then(loadPhotos).then(() => { closeModal(); render(); });
      }
    });

    // Suggestions
    if (action === "get-suggestions-general") el.addEventListener("click", () => generateSuggestions("general"));
    if (action === "get-suggestions-routine") el.addEventListener("click", () => {
      const r = state.routines.find(r => r.id === el.dataset.id);
      if (r) generateSuggestions(r);
    });

    // Settings
    if (action === "save-api-key") el.addEventListener("click", () => {
      state.settings.apiKey = document.getElementById("apiKeyInput").value.trim();
      persist(["settings"]);
      alert("API key saved.");
    });
    if (action === "clear-all-data") el.addEventListener("click", () => {
      if (confirm("This will permanently erase all workouts, routines, body metrics, photos, and settings on this device. Continue?")) {
        localStorage.clear();
        indexedDB.deleteDatabase(PHOTO_DB_NAME);
        location.reload();
      }
    });
    if (action === "export-backup") el.addEventListener("click", () => exportBackup());
    if (action === "restore-backup") el.addEventListener("click", () => document.getElementById("restoreInput").click());
  });

  const histSelect = root.querySelector("#historyExerciseSelect");
  if (histSelect && !histSelect.dataset.wired) {
    histSelect.dataset.wired = "1";
    histSelect.addEventListener("change", () => { selectedHistoryExercise = histSelect.value; render(); });
  }

  const photoInput = root.querySelector("#bodyPhotoInput");
  if (photoInput && !photoInput.dataset.wired) {
    photoInput.dataset.wired = "1";
    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;
      compressImage(file)
        .then(blob => dbAddPhoto({ id: uid(), date: new Date().toISOString(), blob }))
        .then(loadPhotos)
        .then(render)
        .catch(err => alert("Couldn't save photo: " + err.message));
    });
  }

  const restoreInput = root.querySelector("#restoreInput");
  if (restoreInput && !restoreInput.dataset.wired) {
    restoreInput.dataset.wired = "1";
    restoreInput.addEventListener("change", () => {
      const file = restoreInput.files[0];
      if (file) importBackup(file);
    });
  }
}

render();
loadPhotos().then(() => { if (state.tab === "history") render(); }).catch(() => {});
</script>
